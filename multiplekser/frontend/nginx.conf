# Nginx produkcyjny - serwuje zbudowany frontend (SPA, React Router) i reverse-proxuje /api/ do
# backendu POD TYM SAMYM ORIGINEM (ten sam mechanizm co proxy Vite w dev - patrz vite.config.ts).
# Dzieki temu frontend i backend widziane sa przez przegladarke jako jeden origin - CORS
# (CORSMiddleware w FastAPI) jest wiec swiadomie NIEPOTRZEBNY w tej topologii, patrz
# docs/RAPORT_ETAP_10.md.
# Nginx 1.27.5 resolves Docker service names at startup by default.
# Recreated backend containers get new IPs, so use periodic Docker DNS re-resolution.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream multiplekser_api_backend {
    zone multiplekser_api_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upload skanow/PDF-ow dokumentow (POST /api/documents) - domyslny limit Nginx (1M) jest za
    # maly na zdjecia z telefonu.
    client_max_body_size 20m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://multiplekser_api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML should not remain cached across deployments; hashed JS assets may be cached.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA - trasy React Router (np. /documents/{id}) nie odpowiadaja plikom na dysku, wiec kazde
    # nietrafione zadanie wraca do index.html i routing przejmuje przegladarka.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
