# Stos produkcyjny (Etap 10) - odrebny od docker-compose.yml (dev: --reload, bind-mount kodu,
# porty baz danych wystawione na hosta dla wygody lokalnej pracy). Tutaj: obrazy budowane raz
# (bez bind-mountu), postgres/redis/minio NIE sa wystawione na zewnatrz (tylko siec wewnetrzna
# compose). Publicznie dostepny jest tylko `caddy` (80/443) - automatyczne, darmowe HTTPS
# (Let's Encrypt) gdy ustawiona jest prawdziwa domena w DOMAIN (patrz .env.prod.example) -
# reverse-proxuje do `web` (Nginx, statyczny frontend + /api/ do backendu, patrz frontend/nginx.conf).
#
# Uzycie (wlasny VPS z publicznym IP):
#   cp .env.prod.example .env
#   # ... uzupelnij sekrety w .env (patrz komentarze w .env.prod.example) ...
#   # ... jesli masz juz domene wskazujaca (rekord A) na IP serwera, ustaw DOMAIN=twojadomena.pl ...
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.import_catalog
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.import_special_rules
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.create_admin --email ... --password ...

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multiplekser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:-multiplekser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiplekser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?ustaw MINIO_ROOT_USER w .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?ustaw MINIO_ROOT_PASSWORD w .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-multiplekser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multiplekser}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?ustaw JWT_SECRET_KEY w .env - patrz RAPORT_ETAP_5.md}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app worker --loglevel=info
    # Wylacza HEALTHCHECK odziedziczony z obrazu backendu (Dockerfile.prod) - ten HTTP check
    # (curl na :8000/health) jest dla uvicorn, ktorego worker (proces Celery) w ogole nie
    # uruchamia, wiec zawsze zglaszalby "unhealthy" mimo poprawnie dzialajacego workera.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-multiplekser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multiplekser}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY_FREE: ${GEMINI_API_KEY_FREE:-}
      GEMINI_API_KEY_PAID: ${GEMINI_API_KEY_PAID:-}
      # Opcjonalny - wylacznie do niezaleznego cross-checku wyniku Gemini (patrz ocr/crosscheck.py).
      # Brak klucza = cross-check jest po prostu pomijany, dokument dziala normalnie na Gemini.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    # Bez publikacji portu na hosta - jedynym wejsciem z zewnatrz jest teraz `caddy` (80/443),
    # ktory reverse-proxuje tutaj wewnatrz sieci compose.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # Odwrotne proxy terminujace TLS - automatyczne, darmowe certyfikaty Let's Encrypt (zero
  # dodatkowej konfiguracji certbota) gdy DOMAIN w .env wskazuje prawdziwa domene z rekordem A
  # na IP tego serwera. Bez ustawionej domeny (DOMAIN=:80, wartosc domyslna) dziala jako zwykle
  # proxy HTTP bez szyfrowania - wygodne zanim kupisz/podepniesz domene.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
