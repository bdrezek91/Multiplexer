name: Build Multiplekser Portable (Windows .exe)

# Buduje wersje desktopowa (bez Dockera/Postgresa/Redis/MinIO, patrz docs/RAPORT_PORTABLE_1.md)
# na prawdziwym Windowsie - tego nie da sie zweryfikowac lokalnie w sandboksie Linux, wiec ten
# workflow jest jedynym miejscem, gdzie faktyczny plik .exe powstaje i jest sprawdzany.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "portable-v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zbuduj frontend
        working-directory: multiplekser/frontend
        run: |
          npm ci
          npm run build

      - name: Skopiuj zbudowany frontend do backendu
        run: cp -r multiplekser/frontend/dist multiplekser/backend/frontend_dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sprawdz dostepnosc tkinter (wymagane przez okno pierwszego uruchomienia)
        run: python -c "import tkinter"

      - name: Zainstaluj zaleznosci
        working-directory: multiplekser/backend
        run: pip install -r requirements-portable.txt

      - name: Uruchom testy backendu (SQLite/desktop, bez Postgresa)
        working-directory: multiplekser/backend
        run: python -m pytest tests/test_portable_desktop.py tests/test_desktop_main.py -v

      - name: Zbuduj .exe (PyInstaller)
        working-directory: multiplekser/backend
        run: pyinstaller multiplekser_portable.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multiplekser-Portable-Windows
          path: multiplekser/backend/dist/Multiplekser.exe
          retention-days: 90

      - name: Utworz GitHub Release (tylko dla tagow portable-v*)
        if: startsWith(github.ref, 'refs/tags/portable-v')
        uses: softprops/action-gh-release@v2
        with:
          files: multiplekser/backend/dist/Multiplekser.exe
          generate_release_notes: true
